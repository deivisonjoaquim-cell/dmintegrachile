<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-label="D&amp;M Integra Chile — Relocation &amp; Assessoria">
  <defs>
    <linearGradient id="fullGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DC8C" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A6821E" />
    </linearGradient>
    <linearGradient id="fullNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193B57" />
      <stop offset="100%" stop-color="#0B1F33" />
    </linearGradient>
    <linearGradient id="fullEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E824C" />
      <stop offset="100%" stop-color="#0F4D2F" />
    </linearGradient>
    <linearGradient id="fullCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62839" />
      <stop offset="100%" stop-color="#991B26" />
    </linearGradient>
    <clipPath id="fullClip">
      <circle cx="210" cy="112" r="78" />
    </clipPath>
  </defs>

  <!-- Medalhão central refinado -->
  <circle cx="210" cy="112" r="85" fill="#FFFFFF" />
  <path d="M 195 24 A 88 88 0 0 0 137 162" fill="none" stroke="url(#fullEmerald)" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 195 31 A 81 81 0 0 0 142 157" fill="none" stroke="url(#fullGold)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 225 24 A 88 88 0 0 1 283 162" fill="none" stroke="url(#fullCrimson)" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 225 31 A 81 81 0 0 1 278 157" fill="none" stroke="url(#fullNavy)" stroke-width="2.2" stroke-linecap="round" />

  <g clip-path="url(#fullClip)">
    <g stroke="url(#fullGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.52">
      <line x1="210" y1="56" x2="210" y2="38" />
      <line x1="196" y1="62" x2="187" y2="45" />
      <line x1="224" y1="62" x2="233" y2="45" />
      <line x1="183" y1="71" x2="169" y2="57" />
      <line x1="237" y1="71" x2="251" y2="57" />
    </g>
    <polygon points="134,140 173,78 206,140" fill="url(#fullNavy)" />
    <polygon points="173,78 185,100 177,97 173,102 167,97 161,101" fill="#FFFFFF" />
    <polygon points="214,140 247,82 286,140" fill="url(#fullEmerald)" />
    <polygon points="247,82 259,102 251,99 247,104 242,99 235,103" fill="#FFFFFF" />
    <polygon points="159,142 210,57 261,142" fill="url(#fullNavy)" />
    <polygon points="210,57 261,142 217,142 208,97" fill="url(#fullEmerald)" opacity="0.9" />
    <polygon points="210,57 226,85 217,81 210,90 203,82 194,87" fill="#FFFFFF" />

    <!-- Casa -->
    <path d="M 210 101 L 226 113 L 226 134 L 194 134 L 194 113 Z" fill="#FFFFFF" />
    <path d="M 210 98 L 229 112.5 L 226 115.5 L 210 103.5 L 194 115.5 L 191 112.5 Z" fill="url(#fullNavy)" />
    <rect x="205.5" y="118.5" width="9" height="15.5" rx="1.4" fill="url(#fullNavy)" />

    <!-- Fitas Brasil-Chile -->
    <path d="M 128 140 Q 210 119 292 140 L 292 196 L 128 196 Z" fill="#FFFFFF" />
    <path d="M 128 144 Q 173 128 206 138 Q 183 148 158 178 L 128 170 Z" fill="url(#fullEmerald)" />
    <path d="M 132 159 Q 171 140 203 142 Q 181 157 163 186 L 136 180 Z" fill="url(#fullGold)" />
    <path d="M 150 183 Q 177 154 206 141 Q 192 161 182 192 L 155 192 Z" fill="url(#fullEmerald)" opacity="0.92" />
    <path d="M 292 140 Q 247 127 212 139 Q 242 138 292 152 Z" fill="url(#fullNavy)" />
    <path d="M 292 152 Q 244 138 211 143 Q 240 149 286 167 Z" fill="#F8FAFC" />
    <path d="M 286 165 Q 242 147 209 145 Q 233 160 262 192 L 292 183 Z" fill="url(#fullCrimson)" />
    <path d="M 189 194 Q 203 160 210 134 Q 217 160 231 194 Z" fill="#FFFFFF" opacity="0.96" />
  </g>

  <circle cx="210" cy="112" r="78.5" fill="none" stroke="url(#fullGold)" stroke-width="1.2" opacity="0.7" />

  <!-- Estrela Guia -->
  <g transform="translate(210, 27)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" opacity="0.92" />
    <polygon points="0,-9.5 2.5,-2.5 9.5,0 2.5,2.5 0,9.5 -2.5,2.5 -9.5,0 -2.5,-2.5" fill="url(#fullGold)" transform="rotate(45)" />
    <polygon points="0,-16.5 3.5,-3.5 16.5,0 3.5,3.5 0,16.5 -3.5,3.5 -16.5,0 -3.5,-3.5" fill="url(#fullGold)" />
  </g>

  <!-- Tipografia institucional refinada -->
  <text
    x="210"
    y="236"
    text-anchor="middle"
    font-family="Georgia, 'Playfair Display', serif"
    font-size="44"
    font-weight="700"
    letter-spacing="2"
    fill="#0F2537"
  >D<tspan fill="#B69121">&amp;</tspan>M</text>

  <text
    x="210"
    y="274"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="2.4"
    fill="#0F2537"
  >INTEGRA <tspan fill="#146B43">CHILE</tspan></text>

  <text
    x="210"
    y="302"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="12.5"
    font-weight="600"
    letter-spacing="3.2"
    fill="#334155"
  >RELOCATION &amp; ASSESSORIA</text>

  <!-- Filete institucional limpo Brasil / Ouro / Chile -->
  <line x1="94" y1="319" x2="196" y2="319" stroke="url(#fullCrimson)" stroke-width="2.2" stroke-linecap="round" />
  <polygon points="210,313 216,319 210,325 204,319" fill="url(#fullGold)" />
  <line x1="224" y1="319" x2="326" y2="319" stroke="url(#fullEmerald)" stroke-width="2.2" stroke-linecap="round" />
</svg>
