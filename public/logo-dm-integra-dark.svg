<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" fill="none" role="img" aria-label="D&amp;M Integra Chile">
  <defs>
    <linearGradient id="dmGoldDark" x1="6" y1="6" x2="62" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2DA8B"/>
      <stop offset="55%" stop-color="#D4AE45"/>
      <stop offset="100%" stop-color="#B48C27"/>
    </linearGradient>
    <linearGradient id="dmBadgeDark" x1="6" y1="6" x2="62" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A395B"/>
      <stop offset="100%" stop-color="#0E2238"/>
    </linearGradient>
  </defs>
  <!-- Crest Emblem -->
  <rect x="4" y="6" width="60" height="60" rx="14" fill="url(#dmBadgeDark)"/>
  <rect x="6.5" y="8.5" width="55" height="55" rx="11.5" stroke="url(#dmGoldDark)" stroke-width="1.6"/>
