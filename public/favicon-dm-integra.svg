<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173854" />
      <stop offset="100%" stop-color="#0A1A28" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E299" />
      <stop offset="100%" stop-color="#C99E28" />
    </linearGradient>
    <clipPath id="favClip">
      <circle cx="32" cy="32" r="27" />
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#favBg)" />
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#favGold)" stroke-width="2.2" />

  <g clip-path="url(#favClip)">
    <!-- Andes estilizados em alto contraste -->
    <polygon points="10,47 32,19 54,47" fill="#1E4B6E" />
    <polygon points="32,19 54,47 35,47" fill="#146B43" />
    <polygon points="32,19 40,32 35,30 32,34 29,30 24,32" fill="#FFFFFF" />

    <!-- Casa minimalista -->
    <path d="M 32 35 L 38.5 40 L 38.5 47.5 L 25.5 47.5 L 25.5 40 Z" fill="#FFFFFF" />
    <rect x="30.2" y="42" width="3.6" height="5.5" rx="0.6" fill="#0F2537" />

    <!-- Faixas Brasil e Chile na base -->
    <path d="M 4 49 Q 19 43 32 47 L 32 62 L 4 62 Z" fill="#1E824C" />
    <path d="M 6 54 Q 20 48 31 50 L 31 62 L 6 62 Z" fill="url(#favGold)" />
    <path d="M 60 49 Q 45 43 32 47 L 32 62 L 60 62 Z" fill="#D62839" />
    <path d="M 58 47 Q 45 43 32 47 L 32 51 Q 45 48 58 51 Z" fill="#FFFFFF" />
  </g>

  <!-- Estrela guia dourada -->
  <polygon
    points="32,5 33.8,11.2 40,13 33.8,14.8 32,21 30.2,14.8 24,13 30.2,11.2"
    fill="url(#favGold)"
  />
</svg>
