<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="D&amp;M Integra Chile — Emblema Oficial">
  <defs>
    <linearGradient id="dmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DC8C" />
      <stop offset="48%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A6821E" />
    </linearGradient>
    <linearGradient id="dmGoldVert" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F6E299" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7618" />
    </linearGradient>
    <linearGradient id="dmNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193B57" />
      <stop offset="100%" stop-color="#0B1F33" />
    </linearGradient>
    <linearGradient id="dmEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E824C" />
      <stop offset="100%" stop-color="#0F4D2F" />
    </linearGradient>
    <linearGradient id="dmCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62839" />
      <stop offset="100%" stop-color="#991B26" />
    </linearGradient>
    <linearGradient id="dmSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F6FA" />
    </linearGradient>
    <clipPath id="dmInnerCircle">
      <circle cx="120" cy="124" r="88" />
    </clipPath>
  </defs>

  <!-- Fundo circular limpo do medalhão -->
  <circle cx="120" cy="124" r="96" fill="url(#dmSky)" />

  <!-- Anéis externos bilaterais Brasil (esquerda) & Chile (direita) -->
  <!-- Arco externo Brasil (Esmeralda) -->
  <path
    d="M 103 25 A 100 100 0 0 0 38 182"
    fill="none"
    stroke="url(#dmEmerald)"
    stroke-width="6.5"
    stroke-linecap="round"
  />
  <!-- Filete dourado interno Brasil -->
  <path
    d="M 103 33 A 92 92 0 0 0 44 176"
    fill="none"
    stroke="url(#dmGold)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Arco externo Chile (Carmim) -->
  <path
    d="M 137 25 A 100 100 0 0 1 202 182"
    fill="none"
    stroke="url(#dmCrimson)"
    stroke-width="6.5"
    stroke-linecap="round"
  />
  <!-- Filete azul marinho interno Chile -->
  <path
    d="M 137 33 A 92 92 0 0 1 196 176"
    fill="none"
    stroke="url(#dmNavy)"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Fechamento inferior sutil dourado -->
  <path
    d="M 52 197 A 99 99 0 0 0 188 197"
    fill="none"
    stroke="url(#dmGold)"
    stroke-width="2.4"
    stroke-linecap="round"
  />
  <polygon points="120,217 125,223 120,229 115,223" fill="url(#dmGold)" />

  <!-- Cena interna recortada com precisão no medalhão -->
  <g clip-path="url(#dmInnerCircle)">
    <!-- Raios solares sutis atrás da Cordilheira dos Andes -->
    <g stroke="url(#dmGold)" stroke-width="1.6" stroke-linecap="round" opacity="0.52">
      <line x1="120" y1="62" x2="120" y2="42" />
      <line x1="104" y1="68" x2="94" y2="49" />
      <line x1="136" y1="68" x2="146" y2="49" />
      <line x1="90" y1="78" x2="74" y2="62" />
      <line x1="150" y1="78" x2="166" y2="62" />
      <line x1="78" y1="92" x2="60" y2="82" />
      <line x1="162" y1="92" x2="180" y2="82" />
    </g>

    <!-- Cordilheira dos Andes — Pico esquerdo -->
    <polygon points="34,154 78,86 116,154" fill="url(#dmNavy)" />
    <polygon points="78,86 92,110 83,107 78,113 72,107 65,112" fill="#FFFFFF" />

    <!-- Cordilheira dos Andes — Pico direito -->
    <polygon points="124,154 162,90 206,154" fill="url(#dmEmerald)" />
    <polygon points="162,90 175,112 167,108 162,114 156,108 149,113" fill="#FFFFFF" />

    <!-- Cordilheira dos Andes — Pico central dominante -->
    <polygon points="62,158 120,62 178,158" fill="url(#dmNavy)" />
    <!-- Faceta sombreada esmeralda à direita do pico central -->
    <polygon points="120,62 178,158 128,158 118,108" fill="url(#dmEmerald)" opacity="0.9" />
    <!-- Neve facetada no cume central -->
    <polygon points="120,62 138,94 128,89 120,99 112,90 102,96" fill="#FFFFFF" />

    <!-- Silhueta arquitetônica da Casa (Relocation / Novo Lar no Chile) -->
    <path d="M 120 112 L 138 125 L 138 148 L 102 148 L 102 125 Z" fill="#FFFFFF" />
    <path d="M 120 109 L 141 124.5 L 138 128 L 120 114.5 L 102 128 L 99 124.5 Z" fill="url(#dmNavy)" />
    <!-- Porta acolhedora -->
    <rect x="115" y="131" width="10" height="17" rx="1.5" fill="url(#dmNavy)" />
    <circle cx="122.5" cy="139.5" r="1.1" fill="url(#dmGold)" />

    <!-- Faixas fluidas da Ponte Brasil-Chile na base -->
    <!-- Base clara para separação limpa das fitas -->
    <path d="M 28 156 Q 120 132 212 156 L 212 220 L 28 220 Z" fill="#FFFFFF" />

    <!-- Fita Brasil (Esquerda: Esmeralda + Dourado) -->
    <path d="M 28 161 Q 78 143 116 154 Q 90 165 62 198 L 28 190 Z" fill="url(#dmEmerald)" />
    <path d="M 32 178 Q 76 156 112 158 Q 88 175 68 208 L 36 202 Z" fill="url(#dmGold)" />
    <path d="M 52 204 Q 82 171 116 157 Q 100 179 88 214 L 58 214 Z" fill="url(#dmEmerald)" opacity="0.92" />

    <!-- Fita Chile (Direita: Azul Marinho + Branco + Carmim) -->
    <path d="M 212 156 Q 162 141 122 155 Q 156 154 212 169 Z" fill="url(#dmNavy)" />
    <path d="M 212 169 Q 158 154 121 159 Q 154 166 206 186 Z" fill="#F8FAFC" />
    <path d="M 206 184 Q 156 164 119 162 Q 146 178 178 214 L 212 204 Z" fill="url(#dmCrimson)" />

    <!-- Caminho central luminoso integrando os dois países ao lar -->
    <path d="M 96 216 Q 112 178 120 148 Q 128 178 144 216 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M 105 216 Q 115 182 120 152 Q 125 182 135 216 Z" fill="url(#dmGold)" opacity="0.28" />
  </g>

  <!-- Anel fino de acabamento interno -->
  <circle cx="120" cy="124" r="88.5" fill="none" stroke="url(#dmGold)" stroke-width="1.4" opacity="0.7" />

  <!-- Estrela Guia (Estrella Solitaria / Norte) coroando o cume dos Andes -->
  <g transform="translate(120, 29)">
    <!-- Halo discreto para recorte limpo -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" opacity="0.9" />
    <!-- Pontas diagonais -->
    <polygon
      points="0,-11 3,-3 11,0 3,3 0,11 -3,3 -11,0 -3,-3"
      fill="url(#dmGold)"
      transform="rotate(45)"
      opacity="0.88"
    />
    <!-- Pontas cardinais principais -->
    <polygon
      points="0,-19 4,-4 19,0 4,4 0,19 -4,4 -19,0 -4,-4"
      fill="url(#dmGoldVert)"
    />
    <!-- Faceta luminosa central -->
    <polygon points="0,-19 4,-4 0,0" fill="#FFF7D6" opacity="0.85" />
    <polygon points="0,0 19,0 4,4" fill="#A6821E" opacity="0.45" />
  </g>
</svg>
