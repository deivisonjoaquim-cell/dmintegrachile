  <line x1="17" y1="52" x2="51" y2="52" stroke="url(#dmGoldLight)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="78" y="34" fill="#0B1F33" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" letter-spacing="0.4">D&amp;M Integra Chile</text>
  <text x="79" y="53" fill="#8C6B18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2.4">RELOCATION &amp; ASSESSORIA</text>
</svg>
